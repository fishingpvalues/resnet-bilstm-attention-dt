# Linter and Formatter Configuration
# This file defines the code style standards for the ResNet-BiLSTM-Attention Digital Twin project

# Python linting and formatting tools
python:
  # Use Black for code formatting
  black:
    line-length: 100
    target-version: ['py312']
    include: '\.py$'
    exclude: '^\.venv/|^__pycache__/|^\.git/'

  # Use isort for import sorting
  isort:
    profile: black  # Compatible with Black formatter
    line_length: 100
    multi_line_output: 3
    include_trailing_comma: true
    force_grid_wrap: 0
    use_parentheses: true
    ensure_newline_before_comments: true

  # Use flake8 for code linting
  flake8:
    max-line-length: 100
    max-complexity: 12
    ignore:
      - E203  # whitespace before ':' (conflicts with Black)
      - W503  # line break before binary operator
    exclude:
      - .venv
      - __pycache__
      - .git

  # Use mypy for type checking
  mypy:
    python_version: 3.12
    disallow_untyped_defs: false
    disallow_incomplete_defs: false
    check_untyped_defs: true
    disallow_untyped_decorators: false
    no_implicit_optional: true
    warn_redundant_casts: true
    warn_return_any: true

# Jupyter notebook configuration
jupyter:
  nbstripout:
    # Strip output from notebooks before committing
    strip_output: true
    keep_count: false
    keep_metadata: false

# Git hooks configuration
git-hooks:
  pre-commit:
    - lint-staged
    - pytest
  lint-staged:
    '*.py': 
      - black
      - isort
      - flake8
    '*.ipynb':
      - nbstripout

# Documentation style
docs:
  docstring-style: google  # Options: google, numpy, sphinx
  required-sections:
    - description
    - args/params
    - returns
    - raises (if applicable)